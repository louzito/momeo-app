# TodaTempo — wkhtmltopdf est l'adaptateur officiellement supporte par le
# plugin de facturation et ne depend d'aucun daemon/conteneur annexe. Le
# binaire est une dependance explicite de l'hote (voir docs/invoices.md).
sylius_pdf_generation:
    default:
        adapter: knp_snappy
        storage:
            type: filesystem
            directory: '%kernel.project_dir%/var/pdf'
    contexts:
        sylius_invoicing:
            adapter: knp_snappy
            storage:
                type: gaufrette
                filesystem: 'gaufrette.sylius_invoicing_invoice_filesystem'
                local_cache_directory: '%kernel.cache_dir%/sylius_invoicing_pdf/'
