# SkyBook — emails custom (hors triggers Sylius natifs, envoyes explicitement
# depuis notre code via Sylius\Component\Mailer\Sender\SenderInterface::send()).
# Meme mecanique de rendu que order_confirmation / invoice_generated (layout
# commun @SyliusCore/Email/layout.html.twig, textes editables par centre via
# App\Twig\SkybookEmailExtension) — seule la source du declenchement differe
# (pas d'evenement Sylius natif pour "cheque cadeau active" : declenchement
# manuel dans App\GiftVoucher\GiftVoucherMailer).
sylius_mailer:
    emails:
        booking_confirmation:
            subject: todatempo.emails.booking_confirmation.subject
            template: 'email/booking_transactional.html.twig'
        payment_confirmation:
            subject: todatempo.emails.payment_confirmation.subject
            template: 'email/booking_transactional.html.twig'
        booking_cancelled:
            subject: todatempo.emails.booking_cancelled.subject
            template: 'email/booking_transactional.html.twig'
        booking_rescheduled:
            subject: todatempo.emails.booking_rescheduled.subject
            template: 'email/booking_transactional.html.twig'
        booking_reminder:
            subject: todatempo.emails.booking_reminder.subject
            template: 'email/booking_transactional.html.twig'
        waitlist_availability:
            subject: 'Une place est disponible pour votre prestation'
            template: 'email/waitlist_availability.html.twig'
        gift_voucher:
            subject: skybook.emails.gift_voucher.subject
            template: 'email/gift_voucher.html.twig'
