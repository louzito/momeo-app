# SkyBook multi-centres : suite de fixtures MINIMALE pour la BDD template des
# centres blancs du pool (scripts/template-init.sh). Pas de catalogue fashion :
# juste un channel (code FASHION_WEB conserve pour compatibilite avec le front
# et skybook-provision.mjs), locales/devises, pays, virement bancaire et
# l'admin d'installation (renomme au claim). Les personnalisations SkyBook
# (attributs jump_*, taxons skybook_*, methodes Stripe/PayPal) sont ajoutees
# ensuite par skybook-provision.mjs (idempotent).
sylius_fixtures:
    suites:
        skybook_minimal:
            listeners:
                orm_purger: ~
                logger: ~
            fixtures:
                locale:
                    options:
                        locales:
                            - 'en_US'
                            - 'fr_FR'
                currency:
                    options:
                        currencies:
                            - 'EUR'
                            - 'USD'
                geographical:
                    options:
                        countries:
                            - 'FR'
                            - 'BE'
                            - 'CH'
                            - 'US'
                            - 'GB'
                        zones:
                            WORLD:
                                name: 'Monde'
                                countries:
                                    - 'FR'
                                    - 'BE'
                                    - 'CH'
                                    - 'US'
                                    - 'GB'
                channel:
                    options:
                        custom:
                            skybook:
                                name: 'Établissement TodaTempo'
                                code: 'FASHION_WEB'
                                locales:
                                    - 'en_US'
                                currencies:
                                    - 'EUR'
                                enabled: true
                                hostname: 'localhost'
                payment_method:
                    options:
                        custom:
                            bank_transfer:
                                code: 'bank_transfer'
                                name: 'Virement bancaire'
                                channels:
                                    - 'FASHION_WEB'
                                enabled: true
                admin_user:
                    options:
                        custom:
                            -   email: 'sylius@example.com'
                                username: 'sylius'
                                password: 'sylius'
                                enabled: true
                                locale_code: 'en_US'
                                first_name: 'TodaTempo'
                                last_name: 'Admin'
