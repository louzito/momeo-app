doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # SkyBook multi-centres : version serveur STATIQUE, sinon DBAL ouvre une
        # connexion tres tot (detection de plateforme via ClassMetadataFactory)
        # AVANT le TenantRequestListener, et la bascule de dbname rate.
        server_version: '8.4'
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: true
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@prod: &doctrine_prod
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system

when@test_cached: *doctrine_prod
