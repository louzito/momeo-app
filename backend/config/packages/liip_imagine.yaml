liip_imagine:
    resolvers:
        default:
            web_path:
                web_root: "%kernel.project_dir%/public"
                cache_prefix: "media/cache"
    # SkyBook : filtre a nom NEUTRE utilise par le front a la place de
    # sylius_original (URL /media/cache/photo/{slug}/... au lieu de
    # /media/cache/sylius_original/...). Bonus perf : borne a 1600px + qualite 82.
    filter_sets:
        photo:
            quality: 82
            filters:
                thumbnail:
                    size: [1600, 1600]
                    mode: inset
                    allow_upscale: false
